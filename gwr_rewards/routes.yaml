# Candidate reward-journey trips, all starting from Reading.
#
# fare_low_gbp / fare_high_gbp are ROUGH, RESEARCHED ESTIMATES for a one-way
# Anytime/Advance Single in the given class — not live prices. This sandbox
# cannot reach gwr.com to pull live fares, so treat these as "which trip is
# probably worth more," not exact numbers. Always verify the real price on
# gwr.com/the app when the booking window opens before you commit the reward.
#
# day_type: "weekday" -> 24-week booking window, "weekend" -> 12-week window
# class: which reward this trip is a candidate for ("standard", "first", or
#        "either" if you'd consider using either reward on it)

trips:
  - name: "Cardiff — Wales v Australia (Nations Championship)"
    origin: "Reading"
    destination: "Cardiff Central"
    travel_date: "2026-11-21"
    day_type: weekend
    recommended_for: "standard"
    confirmed: true
    class: standard
    fare_low_gbp: 45
    fare_high_gbp: 90
    notes: >
      RECOMMENDED for the Standard reward (expires 25 Feb 2027) — travel
      date sits over 3 months before expiry, comfortable margin. Kick-off
      20:10. GWR expects Cardiff match days to be extremely busy; pay-as-
      you-go isn't available and reservations are effectively mandatory,
      so Advance allocation is contested — book as soon as the window
      opens. HOLDING as of early Sept 2026: the reward code requires BOTH
      singles booked in one session, and the only Cardiff->Reading service
      currently showing is the unusable pre-extras 20:22 baseline. Waiting
      for GWR's post-match extra late services to be published (tracked
      via reminders ~21 Oct / 10 Nov / 20 Nov 2026) before booking either
      leg. Est. full-time ~22:20-22:35, realistically at Cardiff Central
      ~22:45-23:00 after the walk/crowd.

  - name: "Cardiff — Six Nations: Wales v Ireland"
    origin: "Reading"
    destination: "Cardiff Central"
    travel_date: "2027-02-20"
    day_type: weekend
    recommended_for: null   # backup only, see notes
    confirmed: true
    class: standard
    fare_low_gbp: 45
    fare_high_gbp: 95
    notes: >
      BACKUP only — if used with the Standard reward this is just 5 days
      before its 25 Feb 2027 expiry, uncomfortably tight if the fixture
      moves or booking slips. Prefer the Australia trip for Standard and
      the England trip for First; only fall back to this one if Australia
      doesn't work out. Six Nations weekends see the highest demand of the
      rugby calendar in Cardiff.

  - name: "Cardiff — Six Nations: Wales v England"
    origin: "Reading"
    destination: "Cardiff Central"
    travel_date: "2027-03-06"
    day_type: weekend
    recommended_for: "first"
    confirmed: true
    class: first
    fare_low_gbp: 50
    fare_high_gbp: 100
    notes: >
      RECOMMENDED for the First reward (expires 20 Mar 2027) — 2-week
      margin before expiry, and Wales v England is consistently the
      highest-demand Six Nations fixture in Cardiff, likely the single
      priciest matchday fare on this list.

